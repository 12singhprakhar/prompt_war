version: "3.9"

services:
  stadiumflow:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./stadiumflow.db:/app/stadiumflow.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
